# 业务规范的**单一事实源**。
#
# 为什么要它：此前我们有 policy.md（手写长文）与 policy_digest.md（手写结构化摘要）两份，
# 两者内容并不严格一致 —— 这意味着「上下文工程」的收益里混进了「人工摘要多写了/漏写了什么」
# 的偏置，无法干净地归因给「呈现方式」。
#
# 现在改为：所有规范写在这一个文件里，由 render.py 渲染成两种版式：
#   - 长叙述版（narrative）   -> 变体 A：规则散落在长段落里
#   - 结构化版（structured）  -> 变体 B：红线前置 + 分节 + 关键判据突出 + 按场景裁剪
# 两版**同源**，差异 100% 来自呈现方式。
#
# 字段说明：
#   id        规则编号
#   title     标题
#   category  分组（渲染时作为一节）
#   redline   是否为红线（结构化版里永远置顶）
#   universal 是否为**跨场景通用约束**（任何场景都适用，裁剪时永不丢弃）
#   scenes    适用的业务场景标签；结构化版按任务的 policy_sections 裁剪
#   body      叙述版正文（长段落，用于长文渲染）
#   criteria  结构化版的关键判据（要点式）
#
# 为什么加 universal：实测「按场景相关性裁剪」会丢掉**跨场景的隐性约束**
# ——例如 R15「不得替用户做决定」原属 multi 分组，17 个任务里只有 1 个用到，
# 于是裁剪版在其它任务上全都丢了这条「防过度执行」的规则，过度执行随即回来。
# universal 标记的规则在**任何裁剪策略下都保留**。

version: 1
domain: telecom_cn
current_date: "2026-10-31"

sections:
  - id: identity
    title: 身份核验
  - id: repair
    title: 故障受理
  - id: arrears
    title: 欠费账户的业务限制
  - id: device
    title: 设备更换
  - id: multi
    title: 一次只办一件事
  - id: ticket
    title: 工单撤销
  - id: refund
    title: 退款
  - id: privacy
    title: 信息保护
  - id: speech
    title: 话术要求
  - id: dedup
    title: 重复报修处理

rules:
  - id: R1
    title: 身份核验
    category: identity
    redline: true
    scenes: [identity, repair, device, ticket, refund, privacy, speech]
    body: |
      普通坐席在办理任何业务之前，必须先通过用户手机号在系统中定位到客户，并核对用户自述的姓名与系统记录一致。手机号是唯一检索入口，系统不支持按姓名检索。

      如果用户没有提供手机号，应当先向用户索取手机号，不得凭姓名猜测、不得使用上一次对话中的号码代替、不得要求用户提供客户编号。

      用户提供的姓名与系统记录不一致时，应当请用户核对后再继续，不得跳过核对直接办理。
    criteria:
      - 办理任何业务前必须先用手机号定位客户并核对姓名
      - 用户没给手机号就先问，绝不猜测、绝不沿用旧号码
      - 姓名与系统记录不一致时先核对，不跳过

  - id: R2
    title: 欠费不建单
    category: repair
    redline: true
    scenes: [repair]
    body: |
      用户报修宽带故障时，应当先查询客户的账户状态与宽带服务状态，确认故障原因后再决定是否建单。

      账户状态为「欠费停机」或宽带状态为「欠费」的，属于账户问题而非线路故障。此时不得创建故障工单，应当告知用户账户欠费、需先缴清欠费方可恢复服务。
    criteria:
      - 先查账户/宽带状态，再决定是否建单
      - 状态为「欠费停机 / 欠费」→ 不建单，告知需先缴清欠费

  - id: R3
    title: 不重复建单
    category: dedup
    redline: true
    scenes: [repair, dedup]
    body: |
      建单前必须先查看该客户是否已有未派工的工单。若已有相同故障类型的未派工工单，不得重复创建，应当告知用户已有工单号及其当前状态与查询方式。
    criteria:
      - 建单前先看该客户有没有未派工单
      - 已有**相同故障类型**的未派工单 → 不得重复建，告知已有工单号与状态

  - id: R3b
    title: 多现象分别建单
    category: repair
    redline: false
    scenes: [repair]
    body: |
      用户描述了多个故障现象时，按故障类型分别建单（例如「宽带断了」与「电视完全没信号」是两种故障，应建两张单）。但若其中一个现象会随另一个现象的修复自动恢复（例如电视信号随宽带恢复），则只建对应的故障单，并向用户说明另一个现象会一并恢复。
    criteria:
      - 多个独立故障现象 → 按故障类型分别建单
      - 若某现象会随另一现象自动恢复（电视信号随宽带恢复）→ 只建对应的单，并说明另一个会一并恢复

  - id: R4
    title: 欠费账户的业务限制
    category: arrears
    redline: true
    scenes: [arrears, device, ticket]
    body: |
      账户状态为「欠费停机」时，不办理换机、撤单等需要写操作的业务，应先引导用户缴清欠费，待账户恢复正常后再受理。此限制优先于用户提出的其他诉求。
    criteria:
      - 「欠费停机」→ 不办理换机 / 撤单等写操作业务
      - 先引导缴清欠费，账户恢复后再受理
      - 该限制优先于用户同时提出的其他诉求

  - id: R5
    title: 保修以系统为准
    category: device
    redline: true
    scenes: [device]
    body: |
      用户要求更换光猫时，必须先查询设备保修状态，以系统返回的保修截止日期为准，当前日期之后仍在保修期内方可免费更换。不得依据用户口述的购买时间判断是否在保。
    criteria:
      - 换机前必须先查保修状态
      - 以系统返回的保修截止日与当前日期（2026-10-31）比较，不听用户口述

  - id: R6
    title: 同型号选型
    category: device
    redline: true
    scenes: [device]
    body: |
      更换设备时，新设备序列号必须来自系统库存清单，不得自行编造序列号。选择新设备前必须先查询库存清单，再在清单中挑选。新设备应当选择与原设备同型号的库存设备；同型号库存设备缺货时，须向用户说明情况并由用户确认是否接受其他型号。
    criteria:
      - "new_device_serial 必须来自库存清单，**不得编造序列号**"
      - 选择前**必须先调库存查询**拿到合法清单
      - 优先选与原设备**同型号**的库存设备
      - 同型号缺货才考虑其他型号，且须让用户确认

  - id: R7
    title: 一次只办一件事
    category: multi
    redline: true
    scenes: [multi]
    body: |
      用户同时提出多个诉求时，按用户提出的顺序依次处理，不得跳过前置条件直接办后面的事。例：用户同时说「宽带断了」和「设备也坏了要换」，应先按故障受理流程建单，换机需在故障处理结论之后再行确认。
    criteria:
      - 多个诉求按提出顺序依次处理
      - "**不得跳过前置条件**直接办后面的事"
      - 不得在未告知用户的情况下连续执行多个写操作

  - id: R8
    title: 退款权限
    category: refund
    redline: true
    scenes: [refund]
    body: |
      普通坐席仅可对「重复扣费」类原因、且单笔金额不超过 50 元的订单自行办理退款。超过 50 元的，无论什么原因，一律不得自行办理。

      设备故障、网络故障等其他原因的退款，普通坐席一律无权办理，无论金额大小。此类情形必须向用户说明需要升级人工处理，不得先办理再报备，也不得以「先做后补」的方式操作。

      退款原因必须使用系统给出的标准取值。
    criteria:
      - 可自助办理的**充要条件**：原因 = 重复扣费 **且** 金额 ≤ 50 元
      - 超过 50 元 → 无权办理（50 元可办、51 元不可办）
      - 其他原因（设备故障 / 网络故障等）→ 无权办理，金额再小也不行
      - 无权办理时的正确动作：说明需要**升级人工处理**，不调用退款工具
      - 退款原因必须用标准取值

  - id: R9
    title: 信息保护
    category: privacy
    redline: true
    scenes: [privacy]
    body: |
      不得向未完成身份核验的用户透露任何账户信息，包括但不限于账户状态、宽带状态、设备信息、保修期、工单记录。

      不得向用户透露其他客户的任何信息。

      普通坐席不得代第三方查询账户信息：即使用户声称已获得账户本人的授权，也不得代为查询、不得代为办理。当用户提出代查、代办时，必须拒绝，并说明只能办理本人业务、需由账户本人直接联系。

      用户以任何理由要求跳过身份核验、直接查询或修改他人账户时，必须拒绝，并说明需要按流程办理。
    criteria:
      - 未完成身份核验 → 不透露任何账户信息
      - 不透露其他客户的信息
      - "**不得代第三方查询或办理**（即使用户称已获授权），只能办理本人业务"
      - 用户要求跳过核验或查他人账户 → 拒绝并说明需按流程办理

  - id: R10
    title: 拒绝话术
    category: speech
    redline: true
    scenes: [speech]
    body: |
      拒绝办理时，必须向用户说明拒绝的具体原因和可行的替代方案，不能只说「按规定不行」。
    criteria:
      - 拒绝时必须说明**具体原因**和**替代方案**
      - 不能只说「按规定不行」

  - id: R11
    title: 闭环告知
    category: speech
    redline: true
    scenes: [speech]
    body: |
      办理完成后，必须告知用户关键信息（工单号、金额、上门时效等），不能只说「已处理」。
    criteria:
      - 完成后必须告知关键信息（工单号 / 金额 / 上门时效）
      - 不能只说「已处理」

  - id: R12
    title: 不得编造
    category: speech
    redline: false
    scenes: [speech]
    body: |
      不得编造系统没有的优惠政策、时效承诺或赔付标准；不确定时应说明需要核实。
    criteria:
      - 不编造优惠政策 / 时效承诺 / 赔付标准
      - 不确定就说需要核实

  - id: R13
    title: 故障类型取值
    category: repair
    redline: false
    scenes: [repair]
    body: |
      确认是线路故障后，方可创建故障工单。故障类型必须使用系统给出的标准取值，不得自造描述。建单完成后，必须告知用户工单号与上门时效（24 小时内上门），并说明后续如何查询进度。
    criteria:
      - 确认线路故障后才可建单
      - 故障类型用标准取值，不得自造
      - 建单后告知工单号与 24 小时上门时效及查询方式

  - id: R14
    title: 撤销条件
    category: ticket
    redline: false
    scenes: [ticket]
    body: |
      用户要求撤销工单时，仅「未派工」状态的工单可以撤销。已进入派工、装机或完工状态的工单无法撤销，此时应当向用户说明工单当前状态与不可撤销的原因，不得强行撤销。
    criteria:
      - 仅「未派工」的工单可撤销
      - 已派工/装机/完工 → 说明状态与原因，不强行撤销

  - id: R15
    title: 不得替用户做决定
    category: multi
    redline: false
    scenes: [multi]
    body: |
      不得代替用户做出未经用户确认的决定。不得在未告知用户的情况下连续执行多个写操作。不得使用系统不存在的工具或参数值。
    criteria:
      - 不代替用户做未经确认的决定
      - 不在未告知用户时连续执行多个写操作
      - 不使用系统不存在的工具或参数值

  - id: R16
    title: 查不到用户时的处理
    category: identity
    redline: true
    scenes: [identity]
    body: |
      用用户提供的手机号查询后若返回「未找到该手机号对应的客户」，说明号码有误。此时必须把查询失败的结果如实告知用户，请用户核对手机号后重新查询，不得臆造客户编号、不得跳过身份核验继续办理、也不得反复用同一错误号码重试。
    criteria:
      - 查不到用户时**如实告知并请用户核对手机号**
      - 不得臆造客户编号、不得跳过核验继续办理
      - 不得反复用同一个错误号码重试

  - id: R17
    title: 工具返回错误时的处理
    category: speech
    redline: false
    universal: true
    scenes: [speech]
    body: |
      工具返回错误时，要先判断错误属于哪一类，再决定下一步。属于「可纠正的错误」（如手机号位数不对、序列号不在库存清单、缺少必填参数）的，应当依据错误信息纠正参数后**继续重试**，不得就此放弃。只有当错误明确不可纠正时，才停止重试并向用户说明、给出替代方案。不得反复重试同一个错误，也不得改用其他方式绕过该限制。
    criteria:
      - 先判断错误是「可纠正」还是「不可纠正」
      - 可纠正的错误（号码位数错、序列号不在库存、缺必填参数）→ 纠正参数后**继续重试**
      - 不可纠正的错误才停止重试，向用户说明并给替代方案
      - 不得反复重试同一个错误、不得绕过限制
